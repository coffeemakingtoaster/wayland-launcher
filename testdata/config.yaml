is_fullscreen: true
background_color:
  r: 10
  g: 10
  b: 25
  a: 255
background_image_path: "./assets/bg.jpg"
panels:   
  - name: "sleep"
    command: sleep 10
    color:
      r: 100
      g: 100
      b: 100
      a: 255
  - name: "echo"
    command: echo "hello world"
  - name: "youtube"
    command: /usr/bin/firefox --kiosk https://youtube.com
  - name: "unknown command"
    command: giveMeGuinness # maybe they do serve it, who knows?
  - name: "faulty command"
    command: exit1
